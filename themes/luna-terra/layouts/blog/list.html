{{ define "bodyclass" }}page page--blog{{ end }}
{{ define "main" }}

    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="lead">{{ . }}</div>{{ end }}
  </header>
  {{ partial "post-list.html" . }}
</section>
{{ end }}

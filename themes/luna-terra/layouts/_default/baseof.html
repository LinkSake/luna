<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "es" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}page{{ end }}">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  {{ partial "header.html" . }}
  <main id="contenido" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := slice (resources.Get "js/menu.js") (resources.Get "js/lightbox.js") | resources.Concat "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
